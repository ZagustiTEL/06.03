{% extends "base.html" %}
{% block content %}
<h1>Отправка товаров</h1>
<div class="card">
    <form method="post" action="{{ url_for('stock.shipments') }}" class="row">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <select name="product_id" required>
            <option value="">— товар —</option>
            {% for p in products %}
                <option value="{{p.id}}">{{p.sku}} — {{p.name}} (ост. {{p.quantity}})</option>
            {% endfor %}
        </select>
        <input name="quantity" type="number" min="1" placeholder="Количество" required>
        <input name="destination" placeholder="Куда / получатель" maxlength="200">
        <input name="comment" placeholder="Комментарий" maxlength="500">
        <button>Отправить</button>
    </form>
</div>
<div class="card">
    <h3>История отгрузок</h3>
    <table>
        <tr><th>Дата</th><th>Товар</th><th>Кол-во</th><th>Куда</th><th>Пользователь</th></tr>
        {% for r in items %}
            <tr>
                <td>{{ r.created_at }}</td>
                <td>{{ r.sku }} — {{ r.name }}</td>
                <td>-{{ r.quantity }}</td>
                <td>{{ r.destination or '—' }}</td>
                <td>{{ r.user_name or '—' }}</td>
            </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
