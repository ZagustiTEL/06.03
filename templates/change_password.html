{% extends "base.html" %}
{% block content %}
<h1>Смена пароля</h1>
<div class="card">
    <form method="post" class="row">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input name="old_password" type="password" placeholder="Текущий пароль" required>
        <input name="new_password" type="password" placeholder="Новый пароль" required
               minlength="10">
        <input name="confirm_password" type="password" placeholder="Повторите" required minlength="10">
        <button>Сменить пароль</button>
    </form>
    <p class="muted">Минимум 10 символов, буквы и цифры.</p>
</div>
{% endblock %}
